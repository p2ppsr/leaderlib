name: Deploy Server
on:
  push:
    branches:
      - master

env:
  GCR_HOST:        us.gcr.io
  GCP_PROJECT_ID:  computing-with-integrity
  IMAGE_NAME:      leaderlib-server

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    # ──────── 1. Sources & toolchain ──────────────────────────────────
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # ──────── 2. Authenticate for Docker push ────────────────────────
    - name: Auth (push to Container Registry)
      id: auth-push
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.DOCKER_REGISTRY_PUSH_KEY }}

    - name: Configure Docker for GCR
      run: |
        gcloud --quiet auth configure-docker ${{ env.GCR_HOST }}

    # ──────── 3. Build & push image ───────────────────────────────────
    - name: Build and push Docker image
      id: build
      env:
        IMAGE_TAGS: |
          latest
          master-${{ github.sha }}
      run: |
        set -e
        for TAG in $IMAGE_TAGS; do
          IMAGE_URI=${{ env.GCR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${TAG}
          echo "Building $IMAGE_URI"
          docker build -t "$IMAGE_URI" -f packages/server/Dockerfile .
          docker push "$IMAGE_URI"
        done
        echo "IMAGE_URI=${{ env.GCR_HOST }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:master-${{ github.sha }}" >> "$GITHUB_OUTPUT"

    # ──────── 4. Generate service YAML ────────────────────────────────
    - name: Create service description file
      run: |
        chmod +x ./scripts/mkenv.sh
        ./scripts/mkenv.sh service.yaml
      env:
        IMAGE: "${{ steps.build.outputs.IMAGE_URI }}"
        SERVICE: leaderlib-server
        NODE_ENV: production
        LEADERLIB_PRIVATE_KEY_HEX: ${{ secrets.LEADERLIB_PRIVATE_KEY_HEX }}

    # ──────── 5. Authenticate for deployment ──────────────────────────
    - name: Auth (deploy to Cloud Run)
      id: auth-deploy
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_DEPLOY_CREDS }}

    # ──────── 6. Deploy to Cloud Run ───────────────────────────────────
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v1
      with:
        metadata: service.yaml
        region: us-west1
