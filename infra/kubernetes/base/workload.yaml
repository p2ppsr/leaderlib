apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderlib
  labels:
    app.kubernetes.io/name: leaderlib
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: leaderlib
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: leaderlib
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: leaderlib
          image: leaderlib:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: leaderlib-config
            - secretRef:
                name: leaderlib-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
