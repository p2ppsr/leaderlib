apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leaderlib
  labels:
    app.kubernetes.io/name: leaderlib
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts: []
      secretName: leaderlib-tls
  rules: []
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: leaderlib-tls
  labels:
    app.kubernetes.io/name: leaderlib
    app.kubernetes.io/component: tls
spec:
  secretName: leaderlib-tls
  dnsNames: []
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-nginx
